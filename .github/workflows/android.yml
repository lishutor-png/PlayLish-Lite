name: Android CI / Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package PlayLish Lite APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload PlayLish Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayLish-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --continue || true
